name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --extra processor --extra dev

      # bubblewrap is what contains the agent. Without it the security tests
      # skip, and skipped security tests are the ones you stop noticing.
      - name: Install bubblewrap and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y bubblewrap ffmpeg

      # Ubuntu 24.04 runners restrict unprivileged user namespaces via AppArmor,
      # so bwrap installs, runs, and silently does nothing. Without this the
      # isolation tests SKIP, and skipped security tests read as proof while
      # proving nothing.
      - name: Allow unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          # No hand-rolled probe here: the "security tests actually ran" step
          # below is the real check, and it cannot drift from the wrapper the
          # code ships.

      - name: Lint
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest -v

      - name: Configuration docs are not stale
        run: uv run python ops/gen-config-docs.py --check

      # The "security tests must not skip" assertion lives in the suite itself
      # (test_sandbox_is_available_where_it_is_required), gated on $CI. Parsing
      # pytest's summary in shell was fragile and silently reported zero.

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -S warning ops/*.sh

  units:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: systemd unit files parse
        shell: bash
        run: |
          set -o pipefail
          problems=""
          for u in ops/*.service ops/*.timer; do
            # Filter the lints that are expected under `systemd-analyze verify`
            # off a checkout (units reference %h paths and binaries not present
            # on the runner). Anything left is a real defect. `|| true` keeps a
            # non-zero verify from aborting the capture; the emptiness test below
            # is what actually gates.
            out=$(systemd-analyze verify "$u" 2>&1 \
                  | grep -viE 'Unknown (lvalue|section)|command not found' || true)
            if [[ -n "$out" ]]; then
              problems+="--- $u"$'\n'"$out"$'\n'
            fi
          done
          if [[ -n "$problems" ]]; then
            echo "systemd unit verification found problems:"
            printf '%s\n' "$problems"
            exit 1
          fi
          echo "checked $(ls ops/*.service ops/*.timer | wc -l) unit files"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No credential-shaped strings in history
        shell: bash
        run: |
          set -o pipefail
          PATTERN='sk-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|gh[osu]_[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          # Dump history to a file first: `set -e` makes a git failure abort the
          # step (the old pipe swallowed it and printed "history clean"), and a
          # file lets grep read it without the SIGPIPE that `grep -q` in a pipe
          # would turn into a pipefail non-zero. grep -q never echoes the match,
          # so the credential itself stays OUT of the public CI log (the old
          # `grep -aoiE` printed it).
          git log -p --all > history.txt
          if grep -qaiE "$PATTERN" history.txt; then
            echo "::error::credential-shaped string found in git history — content withheld; rotate the key and clean history"
            echo "commits to inspect (content NOT shown):"
            git log --oneline --all -iG "$PATTERN" || true
            exit 1
          fi
          echo "history clean"
